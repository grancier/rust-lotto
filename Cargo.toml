[package]
name = "rust-lotto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lottery number generator for NJ Cash 5, NJ Pick-6, Mega Millions, and Powerball"
repository = "https://github.com/grancier/rust-lotto"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "rust_lotto"
path = "src/lib.rs"

[[bin]]
name = "rust-lotto"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
